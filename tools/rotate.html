<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://shahjahan-madara.github.io/quickpdf/tools/">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotate PDF Pages Online — Free | QuickPDF</title>
<meta name="description" content="Rotate all or selected pages of a PDF 90°, 180°, or 270°. Free browser-based tool — no upload required.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta name="keywords" content="rotate pdf, pdf rotator, rotate pdf pages online free">
<link rel="canonical" href="https://SHAHJAHAN-MADARA.github.io/quickpdf/tools/rotate.html">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Rotate PDF","url":"https://SHAHJAHAN-MADARA.github.io/quickpdf/tools/rotate.html","applicationCategory":"UtilitiesApplication","offers":{"@type":"Offer","price":"0"}}</script>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="logo" href="../"><span class="logo-mark">Q</span><span>QuickPDF</span></a>
    <nav class="nav-links">
      <a href="../tools/merge.html">Merge</a><a href="../tools/split.html">Split</a><a href="../tools/compress.html">Compress</a>
      <a href="../tools/pdf-to-jpg.html">PDF to JPG</a><a href="../tools/jpg-to-pdf.html">JPG to PDF</a><a href="../tools/rotate.html">Rotate</a>
    </nav>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<main class="tool-page">
  <div class="container">
    <div class="tool-head">
      <h1>Rotate PDF</h1>
      <p>Fix sideways or upside-down pages. Rotates 90°, 180°, or 270° in place.</p>
    </div>

    <div class="workspace">
      <div id="dz" class="dropzone" role="button" tabindex="0">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v14m-5-5 5 5 5-5M5 21h14"/></svg>
        <p class="dz-title">Drop a PDF here or click to select</p>
      </div>

      <div id="opts" class="hide" style="margin-top:24px">
        <p id="fileInfo" style="color:var(--text-dim);margin:0 0 16px"></p>
        <label class="field">
          <span class="lbl">Rotation</span>
          <select class="input" id="deg">
            <option value="90">90° clockwise</option>
            <option value="180">180° (flip)</option>
            <option value="270">270° (90° counter-clockwise)</option>
          </select>
        </label>
        <label class="field">
          <span class="lbl">Which pages? (blank = all)</span>
          <input class="input" id="pageInput" placeholder="e.g. 1, 3-5, 8">
        </label>
        <div class="actions">
          <button class="btn btn-outline" id="clearBtn">Choose different file</button>
          <button class="btn btn-primary grow" id="doBtn">🔄 Rotate & Download</button>
        </div>
        <div class="progress hide" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer"><div class="container"><div class="footer-bottom"><div>© <span data-year></span> QuickPDF</div><div><a href="../">Home</a></div></div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="../assets/common.js"></script>
<script>
(function () {
  var file = null, pageCount = 0;
  var dz = document.getElementById('dz'), opts = document.getElementById('opts');
  var info = document.getElementById('fileInfo'), deg = document.getElementById('deg');
  var pageInput = document.getElementById('pageInput'), doBtn = document.getElementById('doBtn');
  var clearBtn = document.getElementById('clearBtn'), progressWrap = document.getElementById('progressWrap');
  var progressBar = document.getElementById('progressBar'), statusEl = document.getElementById('status');

  QP.dropzone(dz, {
    accept: '.pdf,application/pdf', multiple: false,
    onFiles: async function (fs) {
      file = fs[0];
      var buf = await file.arrayBuffer();
      var doc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      pageCount = doc.getPageCount();
      info.innerHTML = '<strong>' + file.name + '</strong> — ' + pageCount + ' pages';
      dz.classList.add('hide'); opts.classList.remove('hide');
    }
  });

  function parseRange(s, max) {
    if (!s.trim()) { var a = []; for (var i = 0; i < max; i++) a.push(i); return a; }
    var out = [];
    s.split(',').forEach(function (p) {
      p = p.trim();
      var m = p.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) { for (var i = +m[1]; i <= +m[2]; i++) if (i >= 1 && i <= max) out.push(i - 1); }
      else if (/^\d+$/.test(p)) { var n = +p; if (n >= 1 && n <= max) out.push(n - 1); }
    });
    return Array.from(new Set(out));
  }

  clearBtn.addEventListener('click', function () { file = null; dz.classList.remove('hide'); opts.classList.add('hide'); statusEl.textContent = ''; });

  doBtn.addEventListener('click', async function () {
    if (!file) return;
    doBtn.disabled = true;
    progressWrap.classList.remove('hide'); progressBar.style.width = '20%';
    try {
      var buf = await file.arrayBuffer();
      var doc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      var indices = parseRange(pageInput.value, pageCount);
      var angle = parseInt(deg.value, 10);
      indices.forEach(function (i) {
        var page = doc.getPage(i);
        var current = page.getRotation().angle;
        page.setRotation(PDFLib.degrees((current + angle) % 360));
      });
      progressBar.style.width = '80%';
      var bytes = await doc.save();
      progressBar.style.width = '100%';
      QP.download(new Blob([bytes], { type: 'application/pdf' }), file.name.replace(/\.pdf$/i, '') + '-rotated.pdf');
      statusEl.textContent = 'Rotated ' + indices.length + ' page(s).';
      QP.toast('Done');
    } catch (err) {
      console.error(err); QP.toast('Rotate failed', true);
    } finally {
      doBtn.disabled = false;
      setTimeout(function () { progressWrap.classList.add('hide'); progressBar.style.width = '0'; }, 1200);
    }
  });
})();
</script>
</body>
</html>
